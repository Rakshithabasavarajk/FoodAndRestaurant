<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Kitchen Ledger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="masthead">
    <h1>The Kitchen Ledger</h1>
    <p class="tagline">A running record of what's cooking</p>
  </header>

  <main class="page">

    <section class="entry-form">
      <h2>Log a new recipe</h2>
      <form id="recipe-form">
        <div class="field">
          <label for="name">Recipe name</label>
          <input type="text" id="name" placeholder="e.g. Lemon Garlic Pasta" required>
        </div>

        <div class="field">
          <label for="ingredients">Ingredients</label>
          <input type="text" id="ingredients" placeholder="Separate with commas: pasta, lemon, garlic" required>
        </div>

        <div class="field">
          <label for="cookingTime">Cooking time (minutes)</label>
          <input type="number" id="cookingTime" min="1" placeholder="e.g. 25" required>
        </div>

        <button type="submit">Add to the ledger</button>
      </form>
    </section>

    <section class="ledger">
      <div class="ledger-header">
        <h2>Recipes on record</h2>
        <span id="recipe-count" class="count"></span>
      </div>
      <div id="recipe-list" class="recipe-grid"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
